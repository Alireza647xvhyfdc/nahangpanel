name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: |
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -ldflags "-s -w" -o tunnelpanel-linux-$a .
          done
          sha256sum tunnelpanel-linux-* > SHA256SUMS
      - run: gh release create "${{ github.ref_name }}" tunnelpanel-linux-* SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
