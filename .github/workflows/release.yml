name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build binaries
        run: |
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$a go build -ldflags "-s -w -X main.version=${{ github.ref_name }}" -o tunnelpanel-linux-$a .
          done
          sha256sum tunnelpanel-linux-* > SHA256SUMS
      - name: Publish release (create, or upload if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release create "$TAG" tunnelpanel-linux-* SHA256SUMS --generate-notes 2>/dev/null; then
            gh release upload "$TAG" tunnelpanel-linux-* SHA256SUMS --clobber
          fi
      - name: Verify release assets (update depends on them)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          names=$(gh release view "$TAG" --json assets -q '.assets[].name')
          for f in tunnelpanel-linux-amd64 tunnelpanel-linux-arm64 SHA256SUMS; do
            echo "$names" | grep -qx "$f" || { echo "Missing asset in release $TAG: $f"; exit 1; }
          done
          echo "All assets present for $TAG"
