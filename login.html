<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nahang · ورود</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#0B0F14;--ink8:#111823;--neon:#22D3EE;--vio:#8B5CF6;--bad:#F87171;--t1:#E6EDF5;--t2:rgba(255,255,255,.62);--t3:rgba(255,255,255,.4);--ln:rgba(255,255,255,.09);color-scheme:dark}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t1);font:14px/1.7 Vazirmatn,Tahoma,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;align-items:center;justify-content:center;padding:24px 16px}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45}
.o1{width:460px;height:460px;background:var(--neon);top:-150px;inset-inline-end:-130px;animation:f1 18s ease-in-out infinite}
.o2{width:400px;height:400px;background:var(--vio);bottom:-160px;inset-inline-start:-120px;animation:f2 22s ease-in-out infinite}
.o3{width:260px;height:260px;background:#34D399;top:50%;inset-inline-start:45%;opacity:.15;animation:f1 26s ease-in-out infinite reverse}
@keyframes f1{50%{transform:translate(-60px,70px) scale(1.15)}}
@keyframes f2{50%{transform:translate(70px,-50px) scale(1.1)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.wrap{position:relative;z-index:1;width:100%;max-width:380px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--ln);border-radius:24px;padding:36px 28px 28px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px -20px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.06)}
.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(34,211,238,.25),rgba(139,92,246,.25));border:1px solid rgba(34,211,238,.35);box-shadow:0 0 36px rgba(34,211,238,.25)}
.logo svg{width:30px;height:30px;stroke:var(--neon)}
h1{margin:0;text-align:center;font-size:20px;font-weight:700}
.sub{margin:4px 0 26px;text-align:center;font-size:12.5px;color:var(--t2)}
label{display:block;font-size:12px;color:var(--t2);margin:0 2px 6px}
.field{position:relative;margin-bottom:16px}
.field svg.ic{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--t3);fill:none;stroke-width:2;pointer-events:none;transition:stroke .2s}
.field:focus-within svg.ic{stroke:var(--neon)}
input{width:100%;height:50px;background:rgba(7,10,15,.6);border:1px solid var(--ln);border-radius:14px;padding:0 44px 0 14px;outline:none;transition:border-color .2s,box-shadow .2s,background .2s}
.field input{padding-inline-start:44px}
input::placeholder{color:var(--t3)}
input:focus{border-color:var(--neon);box-shadow:0 0 0 4px rgba(34,211,238,.12);background:rgba(7,10,15,.85)}
input.ltr{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
.eye{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:none;border-radius:10px;cursor:pointer;display:grid;place-items:center;color:var(--t3)}
.eye:hover{color:var(--t1);background:rgba(255,255,255,.05)}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.btn{width:100%;height:52px;margin-top:8px;border:0;border-radius:14px;cursor:pointer;background:linear-gradient(135deg,var(--neon),#38BDF8 50%,var(--vio));color:#04121A;font-weight:700;font-size:15px;box-shadow:0 12px 30px -8px rgba(34,211,238,.55);transition:transform .15s,box-shadow .2s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:10px}
.btn:hover{transform:translateY(-1px);box-shadow:0 16px 36px -8px rgba(34,211,238,.7)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.7;cursor:wait;transform:none}
.spin{width:18px;height:18px;border:2.5px solid rgba(4,18,26,.25);border-top-color:#04121A;border-radius:50%;animation:spin .7s linear infinite}
.err{min-height:22px;margin-top:14px;text-align:center;font-size:12.5px;color:var(--bad)}
.err.shake{animation:shake .5s}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--t3)}
.foot .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#34D399;box-shadow:0 0 10px #34D399;margin-inline-end:6px;vertical-align:middle}
</style>
</head>
<body>
<div class="orbs" aria-hidden="true"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<main class="wrap">
  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/><circle cx="12" cy="16" r="1.2" fill="currentColor"/></svg>
    </div>
    <h1>پنل تانل Nahang</h1>
    <p class="sub">برای ادامه وارد حساب خود شوید</p>

    <form id="f" autocomplete="on" novalidate>
      <label for="u">نام کاربری</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <input id="u" name="username" class="ltr" value="admin" autocomplete="username" required>
      </div>

      <label for="p">رمز عبور</label>
      <div class="field">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7.5a4 4 0 0 1 8 0V11"/></svg>
        <input id="p" name="password" type="password" class="ltr" autocomplete="current-password" placeholder="••••••••" required autofocus>
        <button type="button" class="eye" id="eye" aria-label="نمایش رمز" title="نمایش رمز">
          <svg id="eyeOn" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOff" viewBox="0 0 24 24" hidden><path d="M17.9 17.9A10.8 10.8 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a18.4 18.4 0 0 1-2.2 3.2M1 1l22 22"/></svg>
        </button>
      </div>

      <button class="btn" id="go" type="submit"><span id="gl">ورود</span></button>
      <div class="err" id="e" role="alert" aria-live="polite"></div>
    </form>
  </div>
  <div class="foot"><span class="dot"></span>اتصال امن · تمامی حقوق محفوظ است</div>
</main>

<script>
(function(){
  var f=document.getElementById('f'),u=document.getElementById('u'),p=document.getElementById('p'),
      go=document.getElementById('go'),gl=document.getElementById('gl'),e=document.getElementById('e'),
      eye=document.getElementById('eye'),on=document.getElementById('eyeOn'),off=document.getElementById('eyeOff');

  eye.onclick=function(){
    var show=p.type==='password';
    p.type=show?'text':'password';
    on.hidden=show; off.hidden=!show;
    eye.setAttribute('aria-label',show?'پنهان کردن رمز':'نمایش رمز');
    p.focus();
  };

  function fail(msg){
    e.textContent=msg;
    e.classList.remove('shake'); void e.offsetWidth; e.classList.add('shake');
    p.select();
  }

  f.onsubmit=async function(ev){
    ev.preventDefault();
    e.textContent='';
    if(!u.value.trim()||!p.value){fail('نام کاربری و رمز عبور را وارد کنید');return}
    go.disabled=true; gl.innerHTML='<span class="spin"></span>';
    try{
      var r=await fetch('/api/login',{
        method:'POST',
        credentials:'same-origin',
        headers:{'Content-Type':'application/json','X-Requested-With':'tunnelpanel'},
        body:JSON.stringify({user:u.value.trim(),pass:p.value})
      });
      if(r.ok){gl.textContent='ورود موفق…';location.replace('/');return}
      var d={};try{d=await r.json()}catch(x){}
      if(r.status===429) fail(d.error||'تلاش‌های ناموفق زیاد؛ چند دقیقه بعد دوباره امتحان کنید');
      else if(r.status===401) fail('نام کاربری یا رمز عبور اشتباه است');
      else fail(d.error||'خطای ناشناخته، دوباره تلاش کنید');
    }catch(x){
      fail('ارتباط با پنل برقرار نشد');
    }
    go.disabled=false; gl.textContent='ورود';
  };
})();
</script>
</body>
</html>
